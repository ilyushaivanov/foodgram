volumes:
  pg_data:
  static_volume:

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: ohilyas/foodgram_backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_volume:/app/static
    depends_on:
      - db

  frontend:
    image: ohilyas/foodgram_frontend
    restart: unless-stopped
    env_file: .env
    command: sh -c "cp -r /app/build/. /static/"
    volumes:
      - static_volume:/static

  nginx:
    image: nginx:1.22.1
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/staticfiles
    ports:
      - "80:80"
    depends_on:
      - backend